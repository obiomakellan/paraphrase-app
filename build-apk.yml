name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --project-name paraphrase_tool --org uk.paraphrasingtool --platforms=android .
          rm -rf test

      - name: Configure Android (internet permission + app name)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&\n    <uses-permission android:name="android.permission.INTERNET"/>|' "$MANIFEST"
          sed -i 's|android:label="[^"]*"|android:label="ParaphraseTool"|' "$MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST" || (echo "INTERNET permission was not added" && cat "$MANIFEST" && exit 1)

      - name: Get packages
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ParaphraseTool-APK
          path: build/app/outputs/flutter-apk/app-release.apk
